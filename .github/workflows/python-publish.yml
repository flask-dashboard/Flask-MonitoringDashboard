name: Upload Python Package

on:
  push:
    branches:
      - master
    paths:
      - flask_monitoringdashboard/constants.json
  workflow_dispatch:

jobs:

  test:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v1
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools --upgrade
        pip install -r requirements-dev.txt
    - name: Lint with flake8
      run: |
        flake8 . --exit-zero --max-line-length=100 --ignore=F401,W503 --max-complexity=10 --max-line-length=100
    - name: Test with pytest
      run: |
        pytest 


  publish:
    runs-on: ubuntu-latest
    needs: [test]
    # PyPI trusted publishing: PyPI accepts this workflow's OIDC token, so no API token secret
    # is needed. The publisher is registered on PyPI for this repo, this file and this environment.
    environment: pypi
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build the front-end
      run: |
        cd flask_monitoringdashboard
        cd frontend
        npm i
        npm run build
    - name: Build
      run: python -m build
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
