<div>
  <div class="card mb-3">
    <div class="card-header"><h4>{{ title }}</h4></div>
    <div class="card-body">
      <div id="chart" #chart>
        <div
          class="spinner"
          *ngIf="isLoading"
        >
          <div class="rect1"></div>
          <div class="rect2"></div>
          <div class="rect3"></div>
          <div class="rect4"></div>
          <div class="rect5"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-7">
      <div class="card">
        <div class="card-header"><h6>Graph options</h6></div>
        <div class="card-body" ng-controller="FormController">
          <form [formGroup]="filterForm">
            <div *ngIf="useDateRange">
              <div class="form-group row">
                <label for="startDate" class="col-sm-2 col-form-label">
                  Start Date
                </label>
              </div>
              <div class="col-sm-10">
                <input
                  type="date"
                  class="form-control"
                  id="startDate"
                  formControlName="startDate"
                />
              </div>

              <div class="form-group row">
                <label for="endDate" class="col-sm-2 col-form-label">
                  End Date
                </label>
              </div>
              <div class="col-sm-10">
                <input
                  type="date"
                  class="form-control"
                  id="endDate"
                  formControlName="endDate"
                />
              </div>
            </div>
            <div *ngIf="useMultiSelect">
              <div
                class="form-group"
                *ngFor="let item of getMultiSelect()"
              >
                <label for="{{ item.name }}" class="col-form-label">Select the
                  {{ item.name }}
                  (hold Shift or Cmd/Ctrl to select multiple):
                </label>
                <select
                  multiple
                  class="form-control"
                  id="{{ item.name }}"
                  [(ngModel)]="item.selected"
                  size="{{ item.values.length < 10 ? item.values.length : 10 }}"
                >
                  <option *ngFor="let obj of item.values" [ngValue]="obj">
                    {{ obj.text }}
                  </option>
                </select>
              </div>
              <!--
              <button
                type="submit"
                class="btn btn-primary"
              >
                Update
              </button>
-->
            </div>
          </form>
        </div>
      </div>
    </div>
    <div class="col-5" style="float: right">
      <div class="card">
        <div class="card-header"><h6>Information</h6></div>
        <div class="card-body" ng-controller="InfoController">
          <b>Graph</b>
          <p>{{ graphText }}</p>
          <b>Axes</b>
          <p>{{ axesText }}</p>
          <b>Content</b>
          <p>{{ contentText }}</p>
        </div>
      </div>
    </div>
  </div>

  <app-endpoint-details />
</div>
