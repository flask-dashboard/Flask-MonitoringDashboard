<ul class="pagination mb-0 ml-2">
  @for (n of [0,1,2,3]; track n) {
    <li class="page-item">
      <a
        class="page-link"
        (click)="sendForm($event, n)"
      [style]='{
    "background-color": computeColor(n),
    "text-decoration": (n === monitoringLevel) ? "underline" : "",
  }'
      >{{ n }}</a>
    </li>
  }
</ul>
